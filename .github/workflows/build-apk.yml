name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Info ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java version must be 17 or higher. Found: $JAVA_MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "Debug APK found at $APK_PATH"
            cp "$APK_PATH" "./TangLongAuto-Debug.apk"
          else
            echo "Error: $APK_PATH is missing!"
            echo "Searching for any generated APKs in app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || echo "No APKs found"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 6

      - name: Create GitHub Release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./TangLongAuto-Debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "Bản Cài Đặt Tàng Long Auto (Tải Trực Tiếp Không Cần Giải Nén)"
          body: |
            ### Hướng dẫn cài đặt trực tiếp:
            1. Bấm tải trực tiếp file **`TangLongAuto-Debug.apk`** ở mục **Assets** bên dưới về điện thoại.
            2. Mở file và bấm **Cài đặt** ngay (Không cần dùng ZArchiver hay giải nén file zip).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


